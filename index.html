    <script>
      // Set the time band before first paint so the palette never flashes.
      (function () {
        var h = new Date().getHours();
        var b = h >= 2 && h < 5 ? "deadzone" : h < 8 && h >= 5 ? "dawn" : h >= 8 && h < 12 ? "morning" : h >= 12 && h < 16 ? "afternoon" : h >= 16 && h < 19 ? "golden" : "night";
        document.documentElement.setAttribute("data-band", b);
      })();
    </script>
